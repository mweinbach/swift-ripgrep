name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-benchmark:
    name: ${{ matrix.name }} / Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            swift: "6.3"
            executable: ripgrep
          - name: macOS arm64
            os: macos-15
            swift: "6.3"
            executable: ripgrep
          - name: Windows x86-64
            os: windows-2025
            swift: "6.3"
            executable: ripgrep.exe

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@e78e9e0996d1f7fb76dcfbbc48f95efcaf47ff91 # v1
        with:
          swift-version: ${{ matrix.swift }}

      - name: Show Swift toolchain
        run: swift --version

      - name: Install verified Rust ripgrep baseline
        run: python bench/install_rust_rg.py --version 15.2.0 --destination .ci-tools

      - name: Build release executable
        if: runner.os == 'macOS'
        run: swift build -c release

      - name: Build self-contained Linux release executable
        if: runner.os == 'Linux'
        run: >-
          swift build
          --scratch-path .build/ci-linux-static
          -c release
          -Xswiftc -static-stdlib

      - name: Build self-contained Windows release executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/build-windows-static.ps1
          -Configuration release
          -ScratchPath .build/ci-windows-static

      - name: Locate release executable
        id: binary
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            $binary = Join-Path $PWD '.build/ci-windows-static/x86_64-unknown-windows-msvc/release/${{ matrix.executable }}'
          } elseif ('${{ runner.os }}' -eq 'Linux') {
            $binPath = swift build --scratch-path .build/ci-linux-static -c release -Xswiftc -static-stdlib --show-bin-path
            $binary = Join-Path $binPath '${{ matrix.executable }}'
          } else {
            $binPath = swift build -c release --show-bin-path
            $binary = Join-Path $binPath '${{ matrix.executable }}'
          }
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Release executable not found at $binary"
          }
          $binary = Resolve-Path -LiteralPath $binary
          $rustBinary = Resolve-Path -LiteralPath (Join-Path '.ci-tools' '${{ runner.os == 'Windows' && 'rg.exe' || 'rg' }}')
          "SWIFT_RG=$binary" >> $env:GITHUB_ENV
          "RUST_RG=$rustBinary" >> $env:GITHUB_ENV
          "SWIFT_RIPGREP_SWIFT_BINARY=$binary" >> $env:GITHUB_ENV
          "SWIFT_RIPGREP_RUST_BINARY=$rustBinary" >> $env:GITHUB_ENV

      - name: Run platform tests
        shell: pwsh
        run: >-
          swift test --filter
          'EncodingLabelTests|WorkerPoolTests|HaystackReaderTests|GeneratedAssetDriftTests|multiLiteralCountCountsEachMatchingLineOnce|wordCountFastPathHonorsASCIIAndUnicodeBoundaries|requiredLiteralRegexCountCountsMatchingLinesOnce|executableLiteralFastPathPreservesGlobalScanModes|executableSortedDirectoryPreflightPreservesRecursiveOutput|executableCapitalizedWordWhitespaceSuffixFastPathPreservesCounts'

      - name: Run full Rust parity matrix
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          SWIFT_RIPGREP_PARITY: "1"
        run: swift test --filter ParityHarnessTests

      - name: Check package has no external dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/check-no-external-deps.sh --skip-build

      - name: Benchmark against Rust ripgrep 15.2.0
        run: >-
          python bench/ci_benchmark.py
          --rg "${{ env.RUST_RG }}"
          --swift-rg "${{ env.SWIFT_RG }}"
          --out benchmark-results
          --warmup 2
          --runs 7
          --corpus-mib 128
          --tree-mib 32

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}-swift-${{ matrix.swift }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
